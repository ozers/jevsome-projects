# Human corrections, keyed by lowercased "owner/repo".
# Use sparingly: an override that keeps being needed is a bug in the pipeline.
#
# Keys: category, name, description, focus (built-on|supports), tier
# (verified|candidate), shelf (listed|new), force (include despite a weak proof
# — say why in a comment).

# --- Official repositories. The SDK's own README is its proof; a recorded
# --- cassette of a live API call is a real call.
