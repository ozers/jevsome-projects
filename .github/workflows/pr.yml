name: Validate

on:
  pull_request:
    paths:
      - 'data/*.yaml'
      - 'pipeline/**'
      - 'site/**'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Rebuild README and site from the committed index
        run: node pipeline/render.mjs && node site/build.mjs
      - name: Fail if README is out of date
        run: git diff --exit-code README.md
