name: Refresh index

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      stages:
        description: 'Leave empty for a full refresh. Or name stages, space separated: discover enrich verify classify health build'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      # Whether a deploy is possible. A step cannot see its own env in `if:`,
      # which kept the deploy step skipped even once secrets existed.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    # One page per query, no language facets. A full crawl never finished.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Restore pipeline caches
        uses: actions/cache@v6
        with:
          path: |
            data/candidates.json
            data/repos.json
            data/verified.json
            data/classified.json
            data/health.json
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Run pipeline
        env:
          # Code search needs a classic/fine-grained PAT; the default token
          # cannot query it. Without GH_PAT the discovery stage degrades to
          # repository search only.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: with no key, classification falls back to keyword rules.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # First page only. The published index is carried forward, so this
          # picks up new repos without re-crawling thousands of hits.
          MAX_PAGES: '1'
          FACET_PAGES: '0'
          # Repo-scoped searches per day for self-described Jev repos with no
          # proof yet; reported repos are always searched on top of this.
          SECOND_CHANCE: '25'
          SECOND_CHANCE_MINUTES: '8'
        run: node pipeline/run.mjs ${{ inputs.stages }}
      # Stages, in order: discover enrich verify classify health build

      - name: Build site
        run: node site/build.mjs

      - name: Commit refreshed data
        run: |
          git config user.name  'jevsome-bot'
          git config user.email 'noreply@github.com'
          git add data/index.json data/not-listed.json data/candidates.json data/*.yaml README.md
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Warn when the site is not deployed
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set. Data was refreshed and committed, but jevsome.ozersubasi.com was NOT updated."

      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
